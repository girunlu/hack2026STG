[project]
name = "unriskomega-backend"
version = "0.1.0"
description = "UNRISKOMEGA prototype backend: F5 data access, F6 CRM context, external inputs, briefing pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "pypdf>=4.0",
    "pdfminer.six>=20221105",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
